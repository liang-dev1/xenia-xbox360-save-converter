name: tests
on:
  push:
  pull_request:
jobs:
  stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -S -m unittest discover -s tests -t .
      - run: python tools/release_audit.py
  signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[signing]'
      - run: python -m pip install -r requirements-signing.txt
      - run: python -m unittest discover -s tests -t .
      - run: python -m compileall -q xsave tests tools
      - run: python tools/release_audit.py --zip
